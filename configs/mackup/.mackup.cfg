# Link mode: `mackup link install` / `mackup link`
#
# Every app Mackup knows about is symlinked from the storage folder unless it
# is ignored below. Use bin/mackup_sync rather than running mackup directly;
# in particular, never run a plain `mackup restore` with this file, which
# replaces every link with a copy.
#
# bin/mackup_audit enforces the rules noted on each section.

[storage]
engine = dropbox
directory = Mackup

[applications_to_ignore]
# Linked from ~/.dotfiles/configs; mackup_audit fails if any app covering a
# file there is not ignored
asdf
docker
git
mise
npm
rtx
rvm
tmux
warp
zsh
mackup

# Never synced
bundler # Machine specific config
gnupg   # Machine specific config
ssh     # Machine specific config; keys stored in 1password
wget    # Machine specific state

# Copy mode; must match applications_to_sync in ~/.mackup-copy.cfg. macOS 14+
# doesn't support symlinks under ~/Library/Preferences, ~/Library/Containers,
# or ~/Library/Group Containers, so any app with files there belongs here.
apple-music
beyond-compare
claude-code           # Claude Code rewrites settings.json, replacing the link
colorschemer-studio-2
cyberduck
divvy
insomnia              # Live app database
iterm2
logitech-options
macdown
macosx
macosx-custom         # KeyboardServices holds a live SQLite database
mailplane
messages
sequel-pro
spotify
terminal
textmate
timeout
transmit
viscosity
vlc
whatsapp
xcode
zoom
